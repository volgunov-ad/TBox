<!DOCTYPE html>
<html lang="__APP_LANG__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta name="color-scheme" content="dark light">
  <title>TBox</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #292f3b;
      --card: #131c2d;
      --text: #e2e2e6;
      --muted: #c2c7cf;
      --btn: #42474e;
      --line: #42474e;
      --accent: #0066cc;
      --accent-soft: rgba(0, 102, 204, 0.28);
      --accent-text: #a8c7ff;
      --shadow: none;
      --heat: #e85d4c;
      --vent: #3dbeff;
      --eco: #00a400;
      --comfort: #00c8ff;
      --strong: #f3a721;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f8f9fa;
        --card: #ffffff;
        --text: #1a1c1e;
        --muted: #72777f;
        --btn: #e8ecf0;
        --line: #e1e5ea;
        --accent-soft: rgba(0, 102, 204, 0.14);
        --accent-text: #0066cc;
        --shadow: 0 1px 3px rgba(16, 24, 40, 0.12);
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .top, main, .tabs-inner { max-width: 720px; margin: 0 auto; }
    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: max(14px, env(safe-area-inset-top)) 16px 10px;
    }
    .brand { flex: 1 1 auto; min-width: 0; }
    .title { font-size: 22px; font-weight: 650; margin: 0; }
    #status { color: var(--muted); font-size: 13px; min-height: 1.2em; }
    .temps { display: flex; gap: 8px; }
    .chip {
      background: var(--card);
      box-shadow: var(--shadow);
      border-radius: 14px;
      padding: 6px 12px;
      min-width: 76px;
      text-align: center;
    }
    .chip span { display: block; color: var(--muted); font-size: 12px; }
    .chip b { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
    main { padding: 4px 16px calc(96px + env(safe-area-inset-bottom)); }
    .page[hidden] { display: none; }
    .card {
      background: var(--card);
      box-shadow: var(--shadow);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    h2 { font-size: 17px; margin: 0 0 6px; font-weight: 650; }
    .label { color: var(--muted); font-size: 14px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0;
    }
    .row + .row, .block + .block, .row + .choice, .choice + .choice, .pair + .choice { border-top: 1px solid var(--line); }
    .row + .pair { border-top: 1px solid var(--line); padding-top: 10px; margin-bottom: 4px; }
    .row-label { min-width: 7.5em; }
    .stepper { display: flex; align-items: center; gap: 8px; }
    .readout { min-width: 4.2em; text-align: center; font-size: 22px; font-variant-numeric: tabular-nums; }
    .volume-row .row-label { min-width: 0; }
    .volume-controls {
      display: flex;
      flex: 1 1 auto;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .volume-controls .readout { min-width: 2.4em; }
    .np-title { font-size: 18px; font-weight: 650; overflow-wrap: anywhere; }
    .np-artist { color: var(--muted); font-size: 14px; min-height: 1.2em; }
    .progress { height: 6px; background: var(--btn); border-radius: 99px; margin: 12px 0 6px; overflow: hidden; }
    .progress > div { height: 100%; width: 0; background: var(--accent); }
    .np-time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; min-height: 1.2em; margin-bottom: 10px; }
    .transport { display: flex; gap: 8px; }
    .transport button { flex: 1; }
    button {
      border: 0;
      border-radius: 12px;
      background: var(--btn);
      color: var(--text);
      min-height: 44px;
      min-width: 44px;
      padding: 0 12px;
      font: inherit;
      font-size: 15px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: default; }
    button.on-heat { background: var(--heat); color: #fff; }
    button.on-vent { background: var(--vent); color: #082028; }
    button.on-off { background: var(--accent); color: #fff; }
    button.on-eco { background: var(--eco); color: #fff; }
    button.on-comfort { background: var(--comfort); color: #082028; }
    button.on-strong { background: var(--strong); color: #1a1200; }
    .levels { display: flex; flex-wrap: wrap; gap: 6px; }
    .levels button { flex: 1 1 auto; }
    .pair { display: flex; gap: 8px; }
    .pair button { flex: 1 1 0; }
    .switches { margin-top: 8px; }
    .pair + .switches { border-top: 1px solid var(--line); padding-top: 10px; }
    .switches + .choice { border-top: 1px solid var(--line); }
    .switches button { white-space: normal; line-height: 1.15; padding: 6px 4px; }
    .choice { padding: 8px 0; }
    .choice .label { margin-bottom: 6px; }
    .block { padding: 10px 0; }
    .block:first-of-type { padding-top: 4px; }
    .block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
    .block-title { font-size: 17px; font-weight: 650; }
    .block-state { color: var(--muted); font-size: 14px; text-align: right; }
    .block-state.open { color: var(--accent-text); font-weight: 600; }
    .grid { display: grid; gap: 6px; }
    .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .grid.cols-7 { grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .grid button { padding: 0 4px; min-width: 0; }
    .hint, #pair-status { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
    #pair-status { min-height: 1.2em; margin: 8px 0 0; }
    .linked { color: var(--accent-text); font-weight: 600; margin: 0 0 10px; }
    button.primary { background: var(--accent); color: #fff; width: 100%; }
    details summary { color: var(--muted); cursor: pointer; margin: 12px 0 8px; }
    .token { display: flex; gap: 8px; }
    .token input {
      flex: 1;
      min-width: 0;
      border: 0;
      border-radius: 12px;
      background: var(--btn);
      color: var(--text);
      padding: 0 12px;
      font: inherit;
    }
    .tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--card);
      box-shadow: 0 -1px 0 var(--line);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
      z-index: 2;
    }
    .tabs-inner { display: flex; }
    .tab {
      flex: 1 1 0;
      min-width: 0;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 2px 0;
      min-height: 56px;
      font-size: 12px;
    }
    .tab .pill {
      width: 56px;
      height: 30px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tab svg { width: 22px; height: 22px; fill: currentColor; }
    .tab .tab-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .tab.selected { color: var(--accent-text); font-weight: 600; }
    .tab.selected .pill { background: var(--accent-soft); }
    @media (min-width: 640px) {
      .windows { display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; }
      .windows .block.all { grid-column: 1 / -1; }
      .windows .block + .block { border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 class="title" id="title">Автомобиль</h1>
      <div id="status"></div>
    </div>
    <div class="temps">
      <div class="chip"><span id="lbl-out">Улица</span><b id="out">—</b></div>
      <div class="chip"><span id="lbl-in">Салон</span><b id="in">—</b></div>
    </div>
  </header>
  <main id="tbox-climate-panel">
    <section class="page" data-page="connect">
      <div class="card" id="connect">
        <h2 id="lbl-connect">Подключение</h2>
        <p class="linked" id="linked" hidden></p>
        <p class="hint" id="pair-hint">На ГУ: Настройки → API → Подключить приложение. Затем нажмите кнопку и подтвердите запрос.</p>
        <button id="pair-btn" class="primary" type="button">Отправить запрос</button>
        <p id="pair-status"></p>
        <details>
          <summary id="lbl-token">Токен вручную</summary>
          <div class="token">
            <input id="token" type="password" autocomplete="off" spellcheck="false">
            <button id="save-token" type="button">OK</button>
          </div>
        </details>
      </div>
    </section>
    <section class="page" data-page="climate" hidden><div class="card" id="climate"></div></section>
    <section class="page" data-page="seats" hidden><div class="card" id="seats"></div></section>
    <section class="page" data-page="music" hidden><div class="card" id="audio"></div></section>
    <section class="page" data-page="body" hidden>
      <div class="card" id="windows"></div>
      <div class="card" id="roof"></div>
      <div class="card" id="shade"></div>
    </section>
  </main>
  <nav class="tabs"><div class="tabs-inner" id="tabs"></div></nav>

      function clientId() {
        var id = localStorage.getItem(CLIENT_ID_KEY);
        if (id) return id;

        localStorage.setItem(CLIENT_ID_KEY, id);
        return id;

      function setPairStatus(text) {

      function delay(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });

      function readJson(response) {
        return response.json().then(function (body) {
          return { status: response.status, body: body };
        });
      }

      function sendPairRequest() {
        if (pairing) return;
        pairing = true;
        document.getElementById("pair-btn").disabled = true;
        setPairStatus(lang.pairSending);
        fetch("/v1/pair/request", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            clientId: clientId(),
            clientName: lang.clientName,
            clientKind: "web"
          })
        }).then(readJson).then(function (res) {
          if (res.status === 403) {
            setPairStatus(lang.pairInactive);
            return null;
          }
          if (res.status !== 202 || !res.body || !res.body.requestId) {
            var message = res.body && res.body.error && res.body.error.message;
            setPairStatus(message || lang.offline);
            return null;
          }
          setPairStatus(lang.pairWaiting);
          return pollPair(res.body.requestId, Date.now() + 120000);
        }).catch(function () {
          setPairStatus(lang.offline);
        }).then(function () {
          pairing = false;
          document.getElementById("pair-btn").disabled = false;
        });
      }

      function pollPair(requestId, deadline) {
        if (Date.now() > deadline) {
          setPairStatus(lang.pairTimeout);
          return;
        }
        return fetch("/v1/pair/status?requestId=" + encodeURIComponent(requestId))
          .then(readJson)
          .then(function (res) {
            if (res.status === 404) {
              setPairStatus(lang.pairLost);
              return;
            }
            var st = res.body && res.body.status;
            if (st === "pending") return delay(1000).then(function () { return pollPair(requestId, deadline); });
            if (st === "denied") {
              setPairStatus(lang.pairDenied);
              return;
            }
            if (st === "approved" && res.body.accessToken) {
              localStorage.setItem(TOKEN_KEY, res.body.accessToken);
              document.getElementById("token").value = res.body.accessToken;
              setPairStatus(lang.pairOk);
              paintConnect();
              showPage(storedPage());
              return;
            }
            setPairStatus(lang.offline);
          });
      }

        var rounded = Math.round(value * 10) / 10;
        var text = (Math.abs(rounded - Math.round(rounded)) < 0.05)
          ? String(Math.round(rounded))
          : rounded.toFixed(1);
        return text + "°";
      }

      function windowOpen(value) {
        return value === WINDOW_BETWEEN || (value != null && value > 0);

      function windowText(value) {
        if (value == null) return "—";
        if (value === 0) return lang.stClosed;
        if (value === WINDOW_BETWEEN) return lang.stOpen;
        return lang.stOpen + " · " + value + "%";
      }

      function roofTilted(value) {
        return value === ROOF_TILT || value === ROOF_TILT_PERCENT;
      }

      function roofText(value, allowTilt) {
        if (value == null) return "—";
        if (allowTilt && roofTilted(value)) return lang.stTilted;
        if (value === 0) return lang.stClosed;
        return lang.stOpen + " · " + value + "%";
      }

      function paintState(id, text, open) {
        var el = document.getElementById(id);
        if (!el) return;
        el.textContent = text;
        el.className = open ? "block-state open" : "block-state";
      }

      function paintBody() {
        var cmds = windowCmds();
        var values = WINDOWS.map(function (pane) { return state.window[pane.signal]; });
        WINDOWS.forEach(function (pane, index) {
          paintState("window-state-" + pane.signal, windowText(values[index]), windowOpen(values[index]));
        });
        var known = values.filter(function (v) { return v != null; });
        var openCount = known.filter(windowOpen).length;
        var allText = known.length === 0 ? "—"
          : openCount === 0 ? lang.stClosed
          : lang.stOpen + " · " + openCount + "/" + known.length;
        paintState("window-all-state", allText, openCount > 0);
        var buttons = document.querySelectorAll("[data-window]");
        for (var i = 0; i < buttons.length; i++) {
          var el = buttons[i];
          var target = el.getAttribute("data-window");
          var cmd = cmds.filter(function (c) { return c.key === el.getAttribute("data-cmd"); })[0];
          var active;
          if (target === "all") {
            active = known.length === WINDOWS.length && values.every(function (v) { return cmd.match(v); });
          } else {
            var v = state.window[target];
            active = v != null && cmd.match(v);
          }
          el.className = active ? "on-off" : "";
        }
        paintState("roof-state", roofText(state.sunroof, true), state.sunroof != null && state.sunroof !== 0);
        paintState("shade-state", roofText(state.sunshade, false), state.sunshade != null && state.sunshade !== 0);
        var roofButtons = document.querySelectorAll("[data-roof]");
        for (var r = 0; r < roofButtons.length; r++) {
          var rb = roofButtons[r];
          var isRoof = rb.getAttribute("data-roof") === "sunroof";
          var current = isRoof ? state.sunroof : state.sunshade;
          var percent = Number(rb.getAttribute("data-percent"));
          var on = current != null && (
            percent === ROOF_TILT ? roofTilted(current) : (current === percent && !(isRoof && roofTilted(current)))
          );
          rb.className = on ? "on-off" : "";
        }
      }

      function adjustRaw(celsius, increase) {
        var base = Math.round(celsius * 10);
        var rem = ((base - TEMP_MIN) % TEMP_STEP + TEMP_STEP) % TEMP_STEP;
        var next = increase
          ? (rem === 0 ? base + TEMP_STEP : base + (TEMP_STEP - rem))
          : (rem === 0 ? base - TEMP_STEP : base - rem);
        if (next < TEMP_MIN) next = TEMP_MIN;
        if (next > TEMP_MAX) next = TEMP_MAX;
        return next;
      }

      function enqueue(task) {
        pendingWrites += 1;
        chain = chain.then(function () {
          return task();
        }).then(function () {
          pendingWrites -= 1;
        }, function () {
          pendingWrites -= 1;
        });
      }

      function invoke(propertyId, value) {
        return postActions([{
          type: "can_command",
          bus: "vehicle",
          propertyId: propertyId,
          operation: "set",
          value: value
        }]);
      }

      function invokeMedia(actionType) {
        return postActions([{
          type: "builtin",
          actionType: actionType,
          intValue: 0,
          stringValue: "",
          boolValue: false
        }]);
      }

      function invokeBuiltin(actionType, intValue) {
        return postActions([{
          type: "builtin",
          actionType: actionType,
          intValue: intValue,
          stringValue: "",
          boolValue: false
        }]);
      }

      function postActions(actions) {
        var current = token();
        if (!current) {
          setStatus(lang.needToken);
          showPage("connect");
          return Promise.resolve();
        }
        return fetch("/v1/actions/invoke", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + current,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ actions: actions })
        }).then(function (response) {
          return response.json().then(function (body) {
            if (response.status === 401) {
              unauthorized();
              return;
            }
            if (!response.ok) {
              var message = body && body.error && body.error.message;
              setStatus(message || lang.offline);
              return;
            }
            var results = body.results || [];
            if (results.length && results[0].success === false) {
              setStatus(results[0].message || lang.offline);
            }
          });
        }).catch(function () {
          setStatus(lang.offline);
        });
      }

      function bumpTemp(side, increase) {
        var current = state[side];
        if (current == null) return;
        var raw = adjustRaw(current, increase);
        state[side] = raw / 10;
        renderTemps();
        var propertyId = side === "left" ? LEFT_TEMP : RIGHT_TEMP;
        enqueue(function () { return invoke(propertyId, raw); });
      }

      function bumpVolume(increase) {
        if (state.volume == null) return;
        var next = state.volume + (increase ? 1 : -1);
        if (next < VOLUME_MIN) next = VOLUME_MIN;
        if (next > VOLUME_MAX) next = VOLUME_MAX;
        state.volume = next;
        if (next > 0) lastMediaVolume = next;
        renderTemps();
        enqueue(function () { return invokeBuiltin("set_media_volume", next); });
      }

      function shownMediaPosition() {
        if (state.mediaPosition == null) return null;
        var pos = state.mediaPosition;
        if (state.mediaPlaying === "on") pos += Date.now() - mediaAnchorAt;
        if (pos < 0) pos = 0;
        if (state.mediaDuration > 0 && pos > state.mediaDuration) pos = state.mediaDuration;
        return pos;
      }

      function fmtClock(ms) {
        if (ms == null || !isFinite(ms) || ms < 0) return "—";
        var total = Math.floor(ms / 1000);
        var hours = Math.floor(total / 3600);
        var minutes = Math.floor(total / 60) % 60;
        var ss = (total % 60 < 10 ? "0" : "") + (total % 60);
        if (hours > 0) return hours + ":" + (minutes < 10 ? "0" : "") + minutes + ":" + ss;
        return Math.floor(total / 60) + ":" + ss;
      }

      function paintNowPlaying() {
        var title = document.getElementById("np-title");
        var artist = document.getElementById("np-artist");
        var bar = document.getElementById("np-bar");
        var time = document.getElementById("np-time");
        var play = document.getElementById("np-play");
        if (!title) return;
        title.textContent = state.mediaTitle || state.mediaArtist || "—";
        artist.textContent = state.mediaTitle ? (state.mediaArtist || "") : "";
        var pos = shownMediaPosition();
        var dur = state.mediaDuration;
        var fraction = dur > 0 && pos != null ? Math.max(0, Math.min(1, pos / dur)) : 0;
        bar.style.width = (fraction * 100) + "%";
        time.textContent = dur > 0 ? fmtClock(pos) + " / " + fmtClock(dur) : "";
        var playing = state.mediaPlaying === "on";
        play.textContent = playing ? lang.pause : lang.play;
        play.className = playing ? "on-off" : "";
      }

      function togglePlayback() {
        if (state.mediaPlaying === "on") {
          state.mediaPosition = shownMediaPosition();
          state.mediaPlaying = "off";
        } else {
          state.mediaPlaying = "on";
          mediaAnchorAt = Date.now();
        }
        paintNowPlaying();
        enqueue(function () { return invokeMedia("media_play_pause"); });
      }

      function toggleMediaMute() {
        if (state.volume == null) return;
        var next;
        if (state.volume > 0) {
          lastMediaVolume = state.volume;
          next = 0;
        } else {
          next = lastMediaVolume > 0 ? lastMediaVolume : 1;
        }
        state.volume = next;
        renderTemps();
        enqueue(function () { return invokeBuiltin("set_media_volume", next); });
      }

      function bumpFan(increase) {
        if (state.fan == null) return;
        var next = state.fan + (increase ? 1 : -1);
        if (next < 0) next = 0;
        if (next > 7) next = 7;
        state.fan = next;
        renderTemps();
        enqueue(function () { return invoke(FAN, next); });
      }

      function toggleAuto() {
        var next = state.auto === "on" ? "off" : "on";
        state.auto = next;
        paintClimate();
        enqueue(function () { return invoke(AUTO, next); });
      }

      function toggleSync() {
        var next = state.sync === "on" ? "off" : "on";
        state.sync = next;
        paintClimate();
        enqueue(function () { return invoke(SYNC, next); });
      }

      function toggleRecirc() { toggleNamed("recirc", RECIRC); }

      function toggleAc() { toggleNamed("ac", AC); }

      /* state.front is "on" while the front section is running. The car signal is the inverse. */
      function toggleFront() { toggleNamed("front", FRONT); }

      function toggleNamed(field, propertyId) {
        var next = state[field] === "on" ? "off" : "on";
        state[field] = next;
        paintClimate();
        enqueue(function () { return invoke(propertyId, next); });
      }

      function setBlow(mode) {
        state.blow = mode.state;
        paintClimate();
        enqueue(function () { return invoke(BLOW, mode.value); });
      }

      function setHvacMode(mode) {
        state.mode = mode.state;
        paintClimate();
        enqueue(function () { return invoke(HVAC_MODE, mode.value); });
      }

      function setSeat(seat, level) {
        state.seat[String(seat.propertyId)] = level.state;
        paintSeats();
        enqueue(function () { return invoke(seat.propertyId, level.value); });
      }

      /* Windows, sunroof and shade move for seconds: the screen follows the car, not the tap. */
      function setWindow(propertyId, cmd) {
        enqueue(function () { return invoke(propertyId, cmd.key); });
      }

      function setRoof(propertyId, percent) {
        var write = percent === ROOF_TILT ? ROOF_TILT_WRITE : Math.floor(percent / 10) + 1;
        enqueue(function () { return invoke(propertyId, write); });
      }

      function indexSignals(payload) {
        var map = {};
        var list = (payload && payload.signals) || [];
        for (var i = 0; i < list.length; i++) map[list[i].id] = list[i];
        return map;
      }

      function pick(primary, fallback) {
        if (primary && primary.available) return primary;
        if (fallback && fallback.available) return fallback;
        return null;
      }

      function numberOrNull(signal) {
        if (!signal || !signal.available || typeof signal.value !== "number") return null;
        return signal.value;
      }

      function stateOrNull(signal) {
        if (!signal || !signal.available || typeof signal.value !== "string") return null;
        return signal.value;
      }

      /** "open" (between the stops) → −1, "N%" → N. */
      function windowValue(signal) {
        var value = stateOrNull(signal);
        if (value == null) return null;
        if (value === "open") return WINDOW_BETWEEN;
        var percent = parseInt(value, 10);
        return isFinite(percent) ? percent : null;
      }

      /** "tilt" → 102, "N%" → N. */
      function roofValue(signal) {
        var value = stateOrNull(signal);
        if (value == null) return null;
        if (value === "tilt") return ROOF_TILT;
        var percent = parseInt(value, 10);
        return isFinite(percent) ? percent : null;
      }

      function loadSignals(source, ids) {
        if (!ids.length) return Promise.resolve({ status: 200, body: { signals: [] } });
        return fetch("/v1/signals?ids=" + encodeURIComponent(ids.join(",")) + "&source=" + source, {
          headers: { "Authorization": "Bearer " + token() }
        }).then(function (response) {
          return response.json().then(function (body) {
            return { status: response.status, body: body };
          });
        });
      }

      function applySnapshot(shown, hu, tbox, app) {
        var outside = pick(hu.outside_temperature, tbox.outside_temperature);
        var inside = pick(tbox.inside_temperature, null);
        state.outside = numberOrNull(outside);
        state.inside = numberOrNull(inside);
        if (shown === "climate") {
          state.left = numberOrNull(hu.hvac_temperature_left);
          state.right = numberOrNull(hu.hvac_temperature_right);
          state.fan = numberOrNull(hu.hvac_fan_speed);
          if (state.fan != null) state.fan = Math.round(state.fan);
          var auto = stateOrNull(hu.hvac_auto);
          if (auto != null) state.auto = auto;
          var sync = stateOrNull(hu.hvac_sync);
          if (sync != null) state.sync = sync;
          var recirc = stateOrNull(hu.hvac_recirculation);
          if (recirc != null) state.recirc = recirc;
          var ac = stateOrNull(hu.hvac_power);
          if (ac != null) state.ac = ac;
          /* "on" on this signal means the front section is stopped. */
          var frontOff = stateOrNull(hu.hvac_front_off);
          if (frontOff != null) state.front = frontOff === "on" ? "off" : "on";
          var blow = stateOrNull(hu.hvac_fan_direction);
          if (blow != null) state.blow = blow;
          var custom = stateOrNull(hu.hvac_custom_mode);
          if (custom != null) state.mode = custom;
        }
        if (shown === "seats") {
          seats.forEach(function (seat) {
            var mode = stateOrNull(hu[seat.signal]);
            if (mode != null) state.seat[String(seat.propertyId)] = mode;
          });
        }
        if (shown === "music" && app) {
          state.volume = numberOrNull(app.hu_media_volume);
          if (state.volume != null) {
            state.volume = Math.round(state.volume);
            if (state.volume > 0) lastMediaVolume = state.volume;
          }
          state.mediaTitle = stateOrNull(app.media_title);
          state.mediaArtist = stateOrNull(app.media_artist);
          state.mediaPosition = numberOrNull(app.media_position_ms);
          state.mediaDuration = numberOrNull(app.media_duration_ms);
          state.mediaPlaying = stateOrNull(app.media_playing);
          mediaAnchorAt = Date.now();
        }
        if (shown === "body") {
          WINDOWS.forEach(function (pane) {
            state.window[pane.signal] = windowValue(hu[pane.signal]);
          });
          state.sunroof = roofValue(hu.sunroof);
          state.sunshade = roofValue(hu.sunshade);
        }
        renderTemps();
      }

      function tick() {
        clearTimeout(timer);
        timer = null;
        if (document.hidden) return;
        if (!token()) {
          setStatus(lang.needToken);
          return;
        }
        if (polling) {
          pollAgain = true;
          return;
        }
        polling = true;
        var shown = page;
        var wanted = PAGE_SIGNALS[shown] || PAGE_SIGNALS.connect;
        Promise.all([
          loadSignals("head_unit", ["outside_temperature"].concat(wanted.head_unit)),
          loadSignals("tbox", ["inside_temperature", "outside_temperature"]),
          loadSignals("app", wanted.app)
        ]).then(function (parts) {
          var denied = parts[0].status === 401 || parts[1].status === 401 || parts[2].status === 401;
          if (denied) {
            unauthorized();
            return;
          }
          if (parts[0].status !== 200) {
            setStatus(lang.offline);
            return;
          }
          if (pendingWrites > 0 || shown !== page) return;
          var app = parts[2].status === 200 ? indexSignals(parts[2].body) : null;
          applySnapshot(shown, indexSignals(parts[0].body), indexSignals(parts[1].body), app);
          paintConnect();
          var now = new Date();
          var hh = String(now.getHours()).padStart(2, "0");
          var mm = String(now.getMinutes()).padStart(2, "0");
          var ss = String(now.getSeconds()).padStart(2, "0");
          setStatus(lang.updated + " " + hh + ":" + mm + ":" + ss);
        }).catch(function () {
          setStatus(lang.offline);
        }).then(function () {
          polling = false;
          if (pollAgain) {
            pollAgain = false;
            tick();
          } else if (!document.hidden && token()) {
            clearTimeout(timer);
            timer = setTimeout(tick, POLL_MS);
          }
        });
      }

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          clearTimeout(timer);
          timer = null;
        } else {
          loadPlatform();
          tick();
        }
      });

      setInterval(function () {
        if (!document.hidden && state.mediaPlaying === "on") paintNowPlaying();
      }, 500);
    })();
  </script>
</body>
</html>
