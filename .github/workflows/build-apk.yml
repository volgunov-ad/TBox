# Build signed APKs and upload them as GitHub Actions artifacts.
# Download: Actions → workflow run → Artifacts.
#
# Triggers:
# - manual (workflow_dispatch): choose flavor + build type
# - push to preRelease: always builds ruDebug for quick HU install

name: Build APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Product flavor
        required: true
        default: ru
        type: choice
        options:
          - ru
          - en
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - preRelease
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".cursor/**"

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}-${{ inputs.flavor || 'ru' }}-${{ inputs.build_type || 'debug' }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve variant
        id: variant
        shell: bash
        run: |
          set -euo pipefail
          # workflow_dispatch inputs; on push to preRelease default to ruDebug
          FLAVOR="${{ github.event.inputs.flavor }}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          FLAVOR="${FLAVOR:-ru}"
          BUILD_TYPE="${BUILD_TYPE:-debug}"
          FLAVOR_CAP="$(echo "${FLAVOR}" | sed 's/./\U&/')"
          BUILD_CAP="$(echo "${BUILD_TYPE}" | sed 's/./\U&/')"
          TASK="assemble${FLAVOR_CAP}${BUILD_CAP}"
          OUT_DIR="app/build/outputs/apk/${FLAVOR}/${BUILD_TYPE}"
          {
            echo "flavor=${FLAVOR}"
            echo "build_type=${BUILD_TYPE}"
            echo "task=${TASK}"
            echo "out_dir=${OUT_DIR}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${TASK}"

      - name: Assemble
        run: ./gradlew --no-daemon --stacktrace "${{ steps.variant.outputs.task }}"

      - name: List APK outputs
        run: |
          set -euo pipefail
          ls -la "${{ steps.variant.outputs.out_dir }}" || true
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tbox-${{ steps.variant.outputs.flavor }}-${{ steps.variant.outputs.build_type }}-${{ github.sha }}
          path: ${{ steps.variant.outputs.out_dir }}/*.apk
          if-no-files-found: error
          retention-days: 30
