# Build signed APKs and upload them as GitHub Actions artifacts.
# Download: Actions → workflow run → Artifacts.
#
# Triggers:
# - manual (workflow_dispatch): choose module, and for Monitor/Store a flavor + build type
# - push to preRelease: always builds Monitor ruDebug for a quick HU install
#
# A push does not build every module. Voice downloads models and camd builds
# native code; those run only when someone picks the module by hand.

name: Build APK

on:
  workflow_dispatch:
    inputs:
      module:
        description: Gradle module
        required: true
        default: app
        type: choice
        options:
          - app
          - store
          - voice
          - phone
          - mqtt
          - dataresize
          - usbaudio
          - fwunlock
          - winpatch
          - camview
          - camd
      flavor:
        description: Language flavor (app and store only)
        required: true
        default: ru
        type: choice
        options:
          - ru
          - en
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - preRelease
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".cursor/**"

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}-${{ inputs.module || 'app' }}-${{ inputs.flavor || 'ru' }}-${{ inputs.build_type || 'debug' }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (ruDebug)
    if: github.event_name == 'push' || github.event.inputs.module == 'app'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testRuDebugUnitTest

  assemble:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: unit-tests
    if: always() && (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve variant
        id: variant
        shell: bash
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          MODULE="${{ github.event.inputs.module }}"
          FLAVOR="${{ github.event.inputs.flavor }}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ "$EVENT" = "push" ]; then
            MODULE="app"
            FLAVOR="ru"
            BUILD_TYPE="debug"
          fi
          MODULE="${MODULE:-app}"
          BUILD_TYPE="${BUILD_TYPE:-debug}"
          BUILD_CAP="$(echo "${BUILD_TYPE}" | sed 's/./\U&/')"
          case "$MODULE" in
            app|store)
              FLAVOR="${FLAVOR:-ru}"
              FLAVOR_CAP="$(echo "${FLAVOR}" | sed 's/./\U&/')"
              TASK=":${MODULE}:assemble${FLAVOR_CAP}${BUILD_CAP}"
              OUT_DIR="${MODULE}/build/outputs/apk/${FLAVOR}/${BUILD_TYPE}"
              ;;
            *)
              FLAVOR=""
              TASK=":${MODULE}:assemble${BUILD_CAP}"
              OUT_DIR="${MODULE}/build/outputs/apk/${BUILD_TYPE}"
              ;;
          esac
          if [ "$MODULE" = "app" ]; then
            ARTIFACT="tbox-monitor"
          else
            ARTIFACT="$MODULE"
          fi
          if [ -n "$FLAVOR" ]; then
            ARTIFACT="${ARTIFACT}-${FLAVOR}"
          fi
          ARTIFACT="${ARTIFACT}-${BUILD_TYPE}"
          {
            echo "module=${MODULE}"
            echo "flavor=${FLAVOR}"
            echo "build_type=${BUILD_TYPE}"
            echo "task=${TASK}"
            echo "out_dir=${OUT_DIR}"
            echo "artifact=${ARTIFACT}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${TASK}"

      - name: Assemble
        run: ./gradlew --no-daemon --stacktrace "${{ steps.variant.outputs.task }}"

      - name: List APK outputs
        run: |
          set -euo pipefail
          ls -la "${{ steps.variant.outputs.out_dir }}" || true
          find "${{ steps.variant.outputs.module }}/build/outputs/apk" -type f -name '*.apk' -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.variant.outputs.artifact }}-${{ github.sha }}
          path: ${{ steps.variant.outputs.out_dir }}/*.apk
          if-no-files-found: error
          retention-days: 30
